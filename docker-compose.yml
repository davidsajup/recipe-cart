# Local dev Postgres. Port 5433 so it doesn't clash with a system Postgres on 5432.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: recipe
      POSTGRES_PASSWORD: recipe
      POSTGRES_DB: recipecart
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
