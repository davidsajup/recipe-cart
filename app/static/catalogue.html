<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogue - Recipe Cart</title>
<style>
  :root {
    --bg: #faf8f5; --card: #ffffff; --ink: #1f2328; --muted: #6b7280;
    --line: #e7e2d9; --accent: #c2410c; --accent-ink: #ffffff;
    --err: #991b1b; --err-bg: #fee2e2; --ok: #166534; --ok-bg: #dcfce7; --dirty: #fff7ed;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17140f; --card: #211d16; --ink: #f1ece3; --muted: #a39b8b;
      --line: #3a3429; --accent: #fb923c; --accent-ink: #1a1208;
      --err: #fca5a5; --err-bg: #3f1d1d; --ok: #86efac; --ok-bg: #14301d; --dirty: #2b2112;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .sub a { color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .bar input[type=search] { flex: 1; min-width: 180px; }
  input, select { padding: 8px 10px; font: inherit; color: var(--ink); background: var(--bg);
                  border: 1px solid var(--line); border-radius: 8px; width: 100%; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; border-radius: 8px;
           background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.danger { color: var(--err); }
  button:disabled { opacity: .45; cursor: default; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 640px; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
       text-align: left; padding: 6px 6px; }
  td { padding: 5px 4px; border-top: 1px solid var(--line); vertical-align: middle; }
  tr.dirty td { background: var(--dirty); }
  tr.new td { background: var(--dirty); }
  td.actions { white-space: nowrap; text-align: right; }
  td.actions button { margin-left: 4px; padding: 6px 10px; }
  .w-name { width: 38%; } .w-size { width: 15%; } .w-unit { width: 14%; } .w-price { width: 15%; }
  .msg { padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; }
  .msg.err { background: var(--err-bg); color: var(--err); }
  .msg.ok { background: var(--ok-bg); color: var(--ok); }
  .count { color: var(--muted); font-size: 13px; margin-top: 10px; }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Catalogue</h1>
  <p class="sub">Products the cart can match. Changes apply to the next cart immediately. <a href="/">Back to cart</a></p>

  <div class="card">
    <div id="msg" aria-live="polite"></div>
    <div class="bar">
      <input id="q" type="search" placeholder="Search products" aria-label="Search products">
      <button id="add" class="primary" type="button">Add product</button>
    </div>
    <div class="scroll">
      <table>
        <thead><tr>
          <th class="w-name">Name</th><th class="w-size">Pack size</th>
          <th class="w-unit">Unit</th><th class="w-price">Price</th><th></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="empty" class="empty" hidden>No products match.</div>
    <div id="count" class="count"></div>
  </div>
</main>

<script>
const rowsEl = document.getElementById("rows"), msgEl = document.getElementById("msg");
const emptyEl = document.getElementById("empty"), countEl = document.getElementById("count");
const UNITS = ["g", "ml", "count"];
let products = [];

function el(tag, props = {}, ...kids) {
  const n = Object.assign(document.createElement(tag), props);
  n.append(...kids);
  return n;
}
function flash(kind, text) {
  msgEl.replaceChildren(el("div", { className: "msg " + kind, textContent: text }));
  if (kind === "ok") setTimeout(() => { if (msgEl.textContent === text) msgEl.replaceChildren(); }, 2500);
}

function token() { try { return sessionStorage.getItem("adminToken") || ""; } catch { return ""; } }
async function api(method, path, body) {
  const headers = { "Content-Type": "application/json" };
  if (token()) headers["X-Admin-Token"] = token();
  let res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  if (res.status === 401) {
    const t = window.prompt("Admin token required:");
    if (!t) throw new Error("Admin token required.");
    try { sessionStorage.setItem("adminToken", t); } catch {}
    headers["X-Admin-Token"] = t;
    res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  }
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    let d = data.detail;
    if (Array.isArray(d)) d = d.map((e) => (e.loc || []).slice(1).join(".") + ": " + e.msg).join("; ");
    throw new Error(d || "Request failed (" + res.status + ").");
  }
  return data;
}

function makeRow(p) {
  const isNew = p.id == null;
  const tr = el("tr", { className: isNew ? "new" : "" });
  const name = el("input", { value: p.name, placeholder: "e.g. Basmati Rice 1kg", "aria-label": "Name" });
  const size = el("input", { type: "number", min: "0", step: "any", value: p.pack_size ?? "", "aria-label": "Pack size" });
  const unit = el("select", { "aria-label": "Unit" }, ...UNITS.map((u) => el("option", { value: u, textContent: u, selected: u === p.unit })));
  const price = el("input", { type: "number", min: "0", step: "any", value: p.price ?? "", "aria-label": "Price" });
  const save = el("button", { type: "button", className: "primary", textContent: isNew ? "Create" : "Save", disabled: !isNew });
  const del = el("button", { type: "button", className: "danger", textContent: isNew ? "Cancel" : "Delete" });

  const read = () => ({ name: name.value.trim(), pack_size: parseFloat(size.value), unit: unit.value, price: parseFloat(price.value) });
  const dirty = () => {
    const v = read();
    return isNew || v.name !== p.name || v.pack_size !== p.pack_size || v.unit !== p.unit || v.price !== p.price;
  };
  const refresh = () => { tr.classList.toggle("dirty", !isNew && dirty()); save.disabled = !dirty(); };
  [name, size, unit, price].forEach((i) => i.addEventListener("input", refresh));

  save.addEventListener("click", async () => {
    const v = read();
    if (!v.name || !(v.pack_size > 0) || !(v.price >= 0)) { flash("err", "Name, a pack size above 0 and a price of 0 or more are required."); return; }
    save.disabled = true;
    try {
      const saved = isNew ? await api("POST", "/products", v) : await api("PUT", "/products/" + p.id, v);
      if (isNew) products.push(saved); else Object.assign(p, saved);
      draft = null;
      flash("ok", (isNew ? "Created " : "Saved ") + saved.name);
      render();
    } catch (e) { flash("err", e.message); save.disabled = false; }
  });
  del.addEventListener("click", async () => {
    if (isNew) { draft = null; render(); return; }
    if (!window.confirm("Delete \"" + p.name + "\"? This cannot be undone.")) return;
    try {
      await api("DELETE", "/products/" + p.id);
      products = products.filter((x) => x.id !== p.id);
      flash("ok", "Deleted " + p.name);
      render();
    } catch (e) { flash("err", e.message); }
  });

  tr.append(el("td", {}, name), el("td", {}, size), el("td", {}, unit), el("td", {}, price), el("td", { className: "actions" }, save, del));
  refresh();
  return { tr, focus: () => name.focus() };
}

let draft = null;
function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const shown = products.filter((p) => p.name.toLowerCase().includes(q)).sort((a, b) => a.name.localeCompare(b.name));
  rowsEl.replaceChildren();
  let focus = null;
  if (draft) { const r = makeRow(draft); rowsEl.append(r.tr); focus = r.focus; }
  for (const p of shown) rowsEl.append(makeRow(p).tr);
  emptyEl.hidden = shown.length > 0 || !!draft;
  countEl.textContent = shown.length + " of " + products.length + " products";
  if (focus) focus();
}

document.getElementById("q").addEventListener("input", render);
document.getElementById("add").addEventListener("click", () => {
  draft = { id: null, name: "", pack_size: "", unit: "g", price: "" };
  render();
});

(async () => {
  try { products = await api("GET", "/products"); render(); }
  catch (e) { flash("err", "Could not load the catalogue: " + e.message); }
})();
</script>
</body>
</html>
