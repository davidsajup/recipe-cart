<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogue - Recipe Cart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/" aria-label="Recipe Cart home">
      <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="#F4F1EA"/><path d="M3 16a13 13 0 0 0 26 0z" fill="#D63A12"/><circle cx="16" cy="16" r="13" fill="none" stroke="#101311" stroke-width="2.5"/></svg>
      <span class="brand__name">recipe cart</span>
    </a>
    <a class="top__link" href="/">Back to the cart</a>
  </header>

  <main style="padding-bottom:64px">
    <div class="steps" style="margin-bottom:28px"><span class="now">Your catalogue</span><span class="next">Changes apply to the very next cart</span></div>
    <h1 class="title" style="margin-bottom:8px;text-transform:none">What's on the shelf</h1>
    <p style="margin:0 0 24px;font-size:17px;color:var(--muted);max-width:620px">The products the cart can match and price. Pack size and price drive the pack gauge on every line.</p>

    <div id="msg" aria-live="polite"></div>
    <div class="cat__bar">
      <label class="sr-only" for="q">Search products</label>
      <input id="q" class="cat__search" type="search" placeholder="Search products">
      <button id="add" class="btn btn--primary" type="button">Add product</button>
    </div>
    <div class="cat__scroll">
      <table class="cat__table">
        <thead><tr><th style="width:38%">Name</th><th style="width:15%">Pack size</th><th style="width:14%">Unit</th><th style="width:15%">Price</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="cat__empty" hidden>No products match.</div>
    </div>
    <div id="count" class="cat__count"></div>
  </main>
</div>

<script>
const rowsEl = document.getElementById("rows"), msgEl = document.getElementById("msg");
const emptyEl = document.getElementById("empty"), countEl = document.getElementById("count");
const UNITS = ["g", "ml", "count"];
let products = [];
let draft = null;

function el(tag, props = {}, ...kids) {
  const n = Object.assign(document.createElement(tag), props);
  n.append(...kids);
  return n;
}
function flash(kind, text) {
  msgEl.replaceChildren(el("div", { className: "msg msg--" + kind, textContent: text }));
  if (kind === "ok") setTimeout(() => { if (msgEl.textContent === text) msgEl.replaceChildren(); }, 2500);
}

function token() { try { return sessionStorage.getItem("adminToken") || ""; } catch { return ""; } }
async function api(method, path, body) {
  const headers = { "Content-Type": "application/json" };
  if (token()) headers["X-Admin-Token"] = token();
  let res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  if (res.status === 401) {
    const t = window.prompt("Admin token required:");
    if (!t) throw new Error("Admin token required.");
    try { sessionStorage.setItem("adminToken", t); } catch {}
    headers["X-Admin-Token"] = t;
    res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  }
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    let d = data.detail;
    if (Array.isArray(d)) d = d.map((e) => (e.loc || []).slice(1).join(".") + ": " + e.msg).join("; ");
    throw new Error(d || "Request failed (" + res.status + ").");
  }
  return data;
}

function makeRow(p) {
  const isNew = p.id == null;
  const tr = el("tr", { className: isNew ? "new" : "" });
  const name = el("input", { value: p.name, placeholder: "e.g. Basmati Rice 1kg", "aria-label": "Name" });
  const size = el("input", { type: "number", min: "0", step: "any", value: p.pack_size ?? "", "aria-label": "Pack size" });
  const unit = el("select", { "aria-label": "Unit" }, ...UNITS.map((u) => el("option", { value: u, textContent: u, selected: u === p.unit })));
  const price = el("input", { type: "number", min: "0", step: "any", value: p.price ?? "", "aria-label": "Price" });
  const save = el("button", { type: "button", className: "btn btn--primary btn--small", textContent: isNew ? "Create" : "Save", disabled: !isNew });
  const del = el("button", { type: "button", className: "btn btn--small btn--danger", textContent: isNew ? "Cancel" : "Delete" });

  const read = () => ({ name: name.value.trim(), pack_size: parseFloat(size.value), unit: unit.value, price: parseFloat(price.value) });
  const dirty = () => {
    const v = read();
    return isNew || v.name !== p.name || v.pack_size !== p.pack_size || v.unit !== p.unit || v.price !== p.price;
  };
  const refresh = () => { tr.classList.toggle("dirty", !isNew && dirty()); save.disabled = !dirty(); };
  [name, size, unit, price].forEach((i) => i.addEventListener("input", refresh));

  save.addEventListener("click", async () => {
    const v = read();
    if (!v.name || !(v.pack_size > 0) || !(v.price >= 0)) { flash("err", "Name, a pack size above 0 and a price of 0 or more are required."); return; }
    save.disabled = true;
    try {
      const saved = isNew ? await api("POST", "/products", v) : await api("PUT", "/products/" + p.id, v);
      if (isNew) products.push(saved); else Object.assign(p, saved);
      draft = null;
      flash("ok", (isNew ? "Created " : "Saved ") + saved.name);
      render();
    } catch (e) { flash("err", e.message); save.disabled = false; }
  });
  del.addEventListener("click", async () => {
    if (isNew) { draft = null; render(); return; }
    if (!window.confirm("Delete \"" + p.name + "\"? This cannot be undone.")) return;
    try {
      await api("DELETE", "/products/" + p.id);
      products = products.filter((x) => x.id !== p.id);
      flash("ok", "Deleted " + p.name);
      render();
    } catch (e) { flash("err", e.message); }
  });

  tr.append(el("td", {}, name), el("td", {}, size), el("td", {}, unit), el("td", {}, price), el("td", { className: "cat__actions" }, save, del));
  refresh();
  return { tr, focus: () => name.focus() };
}

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const shown = products.filter((p) => p.name.toLowerCase().includes(q)).sort((a, b) => a.name.localeCompare(b.name));
  rowsEl.replaceChildren();
  let focus = null;
  if (draft) { const r = makeRow(draft); rowsEl.append(r.tr); focus = r.focus; }
  for (const p of shown) rowsEl.append(makeRow(p).tr);
  emptyEl.hidden = shown.length > 0 || !!draft;
  countEl.textContent = shown.length + " of " + products.length + " products";
  if (focus) focus();
}

document.getElementById("q").addEventListener("input", render);
document.getElementById("add").addEventListener("click", () => {
  draft = { id: null, name: "", pack_size: "", unit: "g", price: "" };
  render();
});

(async () => {
  try { products = await api("GET", "/products"); render(); }
  catch (e) { flash("err", "Could not load the catalogue: " + e.message); }
})();
</script>
</body>
</html>
